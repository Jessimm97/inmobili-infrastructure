services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: immobili-elastic
    environment:
      - node.name=elastic-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - ./data/elastic:/usr/share/elasticsearch/data
    networks:
      - immobili-network

  micro-eureka:
    build:
      context: ./backend/micro-eureka
      dockerfile: dockerfile
    container_name: micro-eureka
    ports:
      - "8761:8761"
    networks:
      - immobili-network

  micro-gateway:
    build:
      context: ./backend/micro-gateway
      dockerfile: dockerfile
    container_name: micro-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://micro-eureka:8761/eureka/
      - "SPRING_CLOUD_GATEWAY_GLOBALCORS_CORSCONFIGURATIONS_[/**]_ALLOWEDORIGINS=*"
      - "SPRING_CLOUD_GATEWAY_GLOBALCORS_CORSCONFIGURATIONS_[/**]_ALLOWEDMETHODS=*"
      - "SPRING_CLOUD_GATEWAY_GLOBALCORS_CORSCONFIGURATIONS_[/**]_ALLOWEDHEADERS=*"
      - "SPRING_CLOUD_GATEWAY_GLOBALCORS_CORSCONFIGURATIONS_[/**]_ALLOWCREDENTIALS=true"
    depends_on:
      - micro-eureka
    networks:
      - immobili-network

  micro-properties:
    build:
      context: ./backend/micro-properties
      dockerfile: dockerfile
    container_name: micro-properties
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://inmobiliapp-db.cbgo4gkcguti.us-east-2.rds.amazonaws.com:3306/${MYSQL_DATABASE:-immobili_db}?sslMode=VERIFY_IDENTITY&sslCa=/app/certs/global-bundle.pem&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER:-admin}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://micro-eureka:8761/eureka/
    volumes:
      - ./global-bundle.pem:/app/certs/global-bundle.pem:ro
    depends_on:
      - elasticsearch
      - micro-eureka
    networks:
      - immobili-network

  micro-agents:
    build:
      context: ./backend/micro-agents
      dockerfile: dockerfile
    container_name: micro-agents
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://inmobiliapp-db.cbgo4gkcguti.us-east-2.rds.amazonaws.com:3306/${MYSQL_DATABASE:-immobili_db}?sslMode=VERIFY_IDENTITY&sslCa=/app/certs/global-bundle.pem&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER:-admin}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://micro-eureka:8761/eureka/
    volumes:
      - ./global-bundle.pem:/app/certs/global-bundle.pem:ro
    depends_on:
      - micro-eureka
    networks:
      - immobili-network

  database-seed:
    image: mysql:8.4
    container_name: immobili-database-seed
    restart: "no"
    environment:
      MYSQL_HOST: inmobiliapp-db.cbgo4gkcguti.us-east-2.rds.amazonaws.com
      MYSQL_PORT: 3306
      MYSQL_DATABASE: "${MYSQL_DATABASE:-immobili_db}"
      MYSQL_USER: "${MYSQL_USER:-admin}"
      MYSQL_PWD: "${MYSQL_PASSWORD}"
    volumes:
      - ./db/seed.sql:/seed.sql:ro
      - ./global-bundle.pem:/certs/global-bundle.pem:ro
    command: >-
      sh -c 'until mysql --host="$$MYSQL_HOST" --port="$$MYSQL_PORT"
      --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE"
      --ssl-mode=VERIFY_IDENTITY --ssl-ca=/certs/global-bundle.pem
      -e "SELECT 1"; do echo "Esperando conexión con RDS..."; sleep 3; done;
      mysql --host="$$MYSQL_HOST" --port="$$MYSQL_PORT"
      --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE"
      --ssl-mode=VERIFY_IDENTITY --ssl-ca=/certs/global-bundle.pem
      < /seed.sql'
    depends_on:
      - micro-properties
    networks:
      - immobili-network

  frontend-react:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: immobili-frontend
    ports:
      - "3000:80"
    depends_on:
      - micro-gateway
    networks:
      - immobili-network

networks:
  immobili-network:
    driver: bridge